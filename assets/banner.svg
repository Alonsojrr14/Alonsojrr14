<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alonso Almeida - Head of QA @ Bemobi Wave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#20223a"/>
      <stop offset="1" stop-color="#2a1e3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70a5fd"/>
      <stop offset="1" stop-color="#bf91f3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#3b4261" opacity="0.5">
    <circle cx="1050" cy="60" r="3"/><circle cx="1090" cy="60" r="3"/><circle cx="1130" cy="60" r="3"/>
    <circle cx="1050" cy="100" r="3"/><circle cx="1090" cy="100" r="3"/><circle cx="1130" cy="100" r="3"/>
    <circle cx="1050" cy="140" r="3"/><circle cx="1090" cy="140" r="3"/><circle cx="1130" cy="140" r="3"/>
  </g>

  <!-- accent bar -->
  <rect x="70" y="96" width="6" height="108" rx="3" fill="url(#accent)"/>

  <!-- name -->
  <text x="100" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#c0caf5">Alonso Almeida</text>

  <!-- role -->
  <text x="102" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#70a5fd">Head of QA @ Bemobi Wave</text>

  <!-- tags -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    <g>
      <rect x="100" y="212" width="180" height="34" rx="17" fill="#292e42"/>
      <text x="190" y="235" fill="#9aa5ce" text-anchor="middle">Test Automation</text>
    </g>
    <g>
      <rect x="292" y="212" width="200" height="34" rx="17" fill="#292e42"/>
      <text x="392" y="235" fill="#9aa5ce" text-anchor="middle">Quality Engineering</text>
    </g>
    <g>
      <rect x="504" y="212" width="150" height="34" rx="17" fill="#292e42"/>
      <text x="579" y="235" fill="#9aa5ce" text-anchor="middle">AI for QA</text>
    </g>
    <g>
      <rect x="666" y="212" width="140" height="34" rx="17" fill="#292e42"/>
      <text x="736" y="235" fill="#9aa5ce" text-anchor="middle">Leadership</text>
    </g>
  </g>

  <!-- terminal glyph -->
  <g transform="translate(980, 150)" opacity="0.9">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="#16161e" stroke="#3b4261" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="#f7768e"/>
    <circle cx="36" cy="18" r="5" fill="#e0af68"/>
    <circle cx="54" cy="18" r="5" fill="#9ece6a"/>
    <text x="16" y="55" font-family="monospace" font-size="15" fill="#9ece6a">&gt; run tests</text>
    <text x="16" y="78" font-family="monospace" font-size="15" fill="#70a5fd">✓ all passing</text>
  </g>
</svg>
